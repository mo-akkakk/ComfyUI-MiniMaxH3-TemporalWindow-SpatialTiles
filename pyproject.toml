[project]
name = "comfyui-minimax-h3-temporal-window-spatial-tiles"
description = "Minimax H3 V2V Temporal Window & Spatial Tiles: long and high-resolution video-to-video for the open-weights MiniMax H3, as overlapping temporal windows sampled one after another plus spatial tiles that follow their exact crop of the plate. Also includes Minimax H3 Long Generation (long text/image-to-video with a per-window prompt timeline), Minimax H3 Multi Guide (many guide frames in one node, with until_step) and Minimax H3 Reference to Video HiRes (reference videos at full generation size above 1 MP)."
